<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>选择大于努力</title>
<style>
/* =====================================================================
   Deck: 选择大于努力 — single file, no external dependencies (offline-safe)
   Palette: cool green-black neutrals + ONE amber accent.
   Shape lock: cards 24px · inner tiles 16px · controls/tags full-pill.
   Two layout modes, chosen in JS (body.m):
     desktop  → fixed 1920x1080 stage scaled to fit (projector / laptop)
     mobile   → fluid single-column pages, each slide scrolls vertically
   ===================================================================== */

:root, html[data-theme="light"]{
  --bg:#F1F5F2; --surface:#FFFFFF; --surface-2:#E4EBE6; --line:#CCD8D0;
  --ink:#0A1A13; --ink-2:#3B4F46; --ink-3:#5C7067;
  --accent:#E8A317; --on-accent:#1B1203; --accent-text:#8A5300; --accent-soft:rgba(232,163,23,.16);
  --emph:#0F2A21; --on-emph:#EAF4EE; --on-emph-2:#A9C2B5; --emph-line:rgba(255,255,255,.14);
  --shadow:0 28px 60px -36px rgba(15,42,33,.45);
  --green:#1F6F52; --tint:color-mix(in srgb,var(--accent) 13%,var(--surface));
}
html[data-theme="dark"]{
  --bg:#07120D; --surface:#0F1F18; --surface-2:#152A21; --line:#24392F;
  --ink:#EAF3EE; --ink-2:#B0C3B8; --ink-3:#8DA398;
  --accent:#F0B02A; --on-accent:#1B1203; --accent-text:#F3BE4B; --accent-soft:rgba(240,176,42,.16);
  --emph:#1B3A2F; --on-emph:#EAF4EE; --on-emph-2:#A9C2B5; --emph-line:rgba(255,255,255,.14);
  --shadow:0 28px 60px -30px rgba(0,0,0,.7);
  --green:#5ED4A6; --tint:color-mix(in srgb,var(--accent) 12%,var(--surface));
}
html{ --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif; }
html[lang="zh-Hant"]{ --sans:system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",sans-serif; }
html[lang="en"]{ --sans:"Segoe UI","SF Pro Display",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  font-variant-numeric:tabular-nums;transition:background .4s,color .4s;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--bg);transition:background .4s}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;
  transform:translate(-50%,-50%) scale(.5);font-size:28px;line-height:1.35}

/* ---------- slide shell & entry choreography ---------- */
.slide{position:absolute;inset:0;padding:72px 96px 64px;opacity:0;visibility:hidden;
  transition:opacity .45s ease,transform .7s cubic-bezier(.16,1,.3,1),visibility 0s .7s}
.slide.is-active{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.slide.is-before{transform:translateX(-90px)}
.slide.is-after{transform:translateX(90px)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .3s,transform .3s}
.slide.is-active .rv{opacity:1;transform:none;
  transition:opacity .7s ease calc(var(--i,0)*70ms + 160ms),transform .85s cubic-bezier(.16,1,.3,1) calc(var(--i,0)*70ms + 160ms)}

/* ---------- shared type & parts ---------- */
.h2{font-size:72px;font-weight:800;line-height:1.08;letter-spacing:-.01em}
.h2 .em{color:var(--accent-text)}
html[lang="en"] .h2{font-size:62px;letter-spacing:-.025em}
.lead{font-size:30px;color:var(--ink-2);font-weight:500}
.chip{display:inline-flex;align-items:center;white-space:nowrap;padding:5px 20px;border-radius:999px;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:24px;line-height:1.3}
.chip.ghost{background:var(--accent-soft);color:var(--accent-text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.card.accent{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.card.emph{background:var(--emph);border-color:transparent;color:var(--on-emph)}
.hl{color:var(--accent-text);font-weight:800}
.k-lab{font-size:24px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}

/* ---------- 1 · cover ---------- */
.s1 .cover{height:100%;display:grid;grid-template-columns:1fr 760px;column-gap:32px;align-items:center}
.s1 h1{font-size:208px;font-weight:800;line-height:1.04;letter-spacing:-.02em;margin-bottom:44px}
.s1 h1 span{display:block}
.s1 h1 .em{color:var(--accent-text)}
html[lang="en"] .s1 h1{font-size:100px;letter-spacing:-.035em;line-height:1.08}
.s1 .cover-sub{font-size:64px;font-weight:700;margin-bottom:22px}
html[lang="en"] .s1 .cover-sub{font-size:52px}
.s1 .cover-small{font-size:34px;color:var(--ink-2);font-weight:500;max-width:22em}
.chart{width:760px;height:720px}
.chart .ax{stroke:var(--line);stroke-width:2;fill:none}
.chart text{font-family:var(--sans);font-size:28px;font-weight:600}
.chart .t-muted{fill:var(--ink-3)}
.chart .t-lin{fill:var(--ink-2)}
.chart .t-acc{fill:var(--accent-text);font-weight:800;font-size:32px}
.chart .line{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len,2000);stroke-dashoffset:var(--len,2000);transition:stroke-dashoffset .4s}
.chart .lin{stroke:var(--ink-3);stroke-width:7}
.chart .exp{stroke:var(--accent);stroke-width:12}
.chart .gap{fill:var(--accent-soft);opacity:0;transition:opacity .3s}
.chart .endpt{fill:var(--accent);opacity:0;transition:opacity .3s}
.chart .lbl{opacity:0;transition:opacity .3s}
.slide.is-active .chart .line{stroke-dashoffset:0;transition:stroke-dashoffset 1.9s cubic-bezier(.45,.05,.2,1) .55s}
.slide.is-active .chart .exp{transition-delay:.85s;transition-duration:2.1s}
.slide.is-active .chart .gap{opacity:1;transition:opacity 1s ease 2.3s}
.slide.is-active .chart .endpt{opacity:1;transition:opacity .5s ease 2.8s}
.slide.is-active .chart .lbl{opacity:1;transition:opacity .8s ease 2.3s}

/* ---------- 2 · nine advantages ---------- */
.s2 .h2{margin-bottom:30px}
.adv-grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,258px);gap:24px}
.adv{grid-column:span var(--span);padding:28px 34px;display:flex;flex-direction:column;overflow:hidden}
.adv-n{font-size:26px;font-weight:800;color:var(--accent-text);letter-spacing:.04em}
.adv.accent .adv-n{color:var(--on-accent);opacity:.65}
.adv.emph .adv-n{color:var(--accent)}
.adv h3{font-size:48px;font-weight:800;line-height:1.18;margin-top:12px;letter-spacing:-.005em}
html[lang="en"] .adv h3{font-size:39px;letter-spacing:-.02em}
.adv p{font-size:30px;line-height:1.38;margin-top:10px;color:var(--ink-2);font-weight:500}
html[lang="en"] .adv p{font-size:27px}
.adv.accent p{color:var(--on-accent);opacity:.82}
.adv.emph p{color:var(--on-emph-2)}

/* ---------- 3 · levels staircase ---------- */
.s3 .top,.s4 .top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.s3 .h2,.s3 .top .lead{white-space:nowrap}
.s3 .top .r,.s4 .top .r{display:flex;align-items:center;gap:18px;padding-bottom:8px}
.tbl{display:grid;grid-template-columns:232px repeat(4,1fr);column-gap:12px;align-items:stretch}
.tbl .lab{display:flex;align-items:center;height:52px;font-size:22px;font-weight:600;color:var(--ink-2)}
.tbl .lab:first-child{height:auto}
.tbl .hd{height:var(--h);align-self:end;border-radius:24px 24px 0 0;padding:14px 22px;display:flex;flex-direction:column;justify-content:flex-end}
.tbl .hd small{font-size:22px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.tbl .hd b{font-size:48px;font-weight:800;line-height:1.1}
.tbl .c{height:52px;padding:0 22px;display:flex;align-items:center;font-size:24px;font-weight:600;white-space:nowrap}
.tbl .c.dash{color:var(--ink-3);font-weight:400}
.tbl .last{border-radius:0 0 24px 24px}
.t1{background:var(--surface-2)} .t2,.t3{background:var(--surface)}
.hd.t1,.hd.t2,.hd.t3{border:1px solid var(--line);border-bottom:0}
.c.t1,.c.t2,.c.t3{border:solid var(--line);border-width:0 1px 1px}
.hd.t4{background:var(--accent);color:var(--on-accent)}
.hd.t4 small{color:var(--on-accent);opacity:.7}
.c.t4{background:var(--emph);color:var(--on-emph);border-bottom:1px solid var(--emph-line)}
.c.t4.last{border-bottom:0}
.tbl.mob{display:grid;grid-template-columns:1fr;gap:12px}
.tcard{border-radius:24px;padding:16px 18px;border:1px solid var(--line);background:var(--surface)}
.tcard.t1{background:var(--surface-2)}
.tcard.t4{background:var(--emph);color:var(--on-emph);border-color:transparent}
.tcard .th{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.tcard .th span{font-size:15px;font-weight:700;color:var(--ink-2)}
.tcard .th b{font-size:32px;font-weight:800}
.tcard.t4 .th span{color:var(--on-emph-2)} .tcard.t4 .th b{color:var(--accent)}
.tcard .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tcard.t4 .kv{border-color:var(--emph-line)}
.tcard .kv span{color:var(--ink-2)} .tcard.t4 .kv span{color:var(--on-emph-2)}
.tcard .kv em{font-style:normal;font-weight:700;text-align:right}
.legend{margin:10px 0 18px;font-size:21px;color:var(--ink-3);font-weight:500;padding-left:244px}
.paths-t{font-size:30px;font-weight:800;margin-bottom:12px}
.paths{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.path{padding:20px 22px;display:flex;flex-direction:column;gap:8px;box-shadow:none}
.path h4{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800;line-height:1.2}
html[lang="en"] .path h4{font-size:22px}
.path .no{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:20px;font-weight:800}
.path p{font-size:22px;line-height:1.35;color:var(--ink-2);font-weight:500}
html[lang="en"] .path p{font-size:21px}

/* ---------- 4 · seven bonuses (colour focus: 02 repurchase · 06 matching · 07 lucky) ---------- */
.s4 .base{display:flex;align-items:center;gap:22px;padding:14px 32px;margin-bottom:16px;font-size:34px;font-weight:700;border-radius:24px}
.s4 .base .tag{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:4px 22px;font-size:26px;font-weight:800}
html[lang="en"] .s4 .base{font-size:30px}
.aw-grid{display:grid;grid-template-columns:560px 1fr;grid-template-rows:repeat(3,152px) 216px;gap:16px}
.aw{padding:14px 28px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}
.aw .nm{display:flex;align-items:baseline;gap:14px}
.aw .nm i{font-style:normal;font-size:22px;font-weight:800;color:var(--accent-text);letter-spacing:.04em}
.aw .nm b{font-size:40px;font-weight:800;line-height:1.15}
html[lang="en"] .aw .nm b{font-size:34px;letter-spacing:-.02em}
.aw .sub{white-space:nowrap;font-size:22px;color:var(--ink-2);font-weight:500;line-height:1.3}
.aw.emph .nm i{color:var(--accent)} .aw.accent .nm i{color:var(--on-accent);opacity:.6}
.aw.emph .sub{color:var(--on-emph-2)} .aw.accent .sub{color:var(--on-accent);opacity:.8}
.aw .hd-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}
.aw .ttl{display:flex;align-items:baseline;gap:18px}
.aw .hd-row .chip{font-size:22px}
.aw.accent .chip{background:var(--on-accent);color:var(--accent)}
/* colour groups: 01 white · 02+03 dark green · 04+05 soft amber tint · 06+07 amber */
.aw.tint{background:var(--tint)}
.aw.tint .node .dot{box-shadow:0 0 0 4px var(--tint)}
.aw.tint2{background:var(--surface-2)}
.aw.tint2 .node .dot{box-shadow:0 0 0 4px var(--surface-2)}
.aw.tint2 .trio span,.aw.tint2 .trio em{color:var(--ink-3)}
.aw.emph .rail::before{background:var(--emph-line)}
.aw.emph .node .dot{background:var(--accent);box-shadow:0 0 0 4px var(--emph)}
.aw.emph .node .pp{color:var(--on-emph-2)}
.aw.emph .node .amt{color:var(--on-emph)}
.aw.emph .node.last .amt{color:var(--accent)}
.aw.accent .big{color:var(--on-accent)}
.aw.accent .stat{background:rgba(27,18,3,.10);border-color:rgba(27,18,3,.18)}
.aw.accent .stat span,.aw.accent .stat em{color:var(--on-accent);opacity:.75}
.aw.accent .stat b{color:var(--on-accent)}
/* quiet = white / tinted cards */
.aw.quiet .nm i{color:var(--ink-3)}
.aw.quiet .chip{background:var(--surface-2);color:var(--ink-2)}
.rail{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr)}
.rail::before{content:"";position:absolute;left:7px;right:calc(100% / var(--n) - 7px);top:6px;height:3px;border-radius:2px;background:var(--line)}
.node{position:relative;display:flex;flex-direction:column}
.node .dot{width:15px;height:15px;border-radius:50%;background:var(--ink-3);box-shadow:0 0 0 4px var(--surface)}
.node .pp{font-size:20px;color:var(--ink-3);font-weight:600;margin-top:6px;white-space:nowrap}
.node .amt{font-size:32px;font-weight:800;line-height:1.12;white-space:nowrap}
.node.last .amt{font-size:36px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:2px}
.trio div{display:flex;flex-direction:column}
.trio span{font-size:18px;font-weight:800;color:var(--ink-3);letter-spacing:.04em}
.trio b{font-size:36px;font-weight:800;line-height:1.1}
.trio em{font-style:normal;font-size:18px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.aw.emph .big{color:var(--accent)}
.big{font-size:104px;font-weight:800;line-height:1;color:var(--accent-text);letter-spacing:-.02em}
.a2row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 0}
.a2row+.a2row{border-top:1px solid var(--emph-line)}
.a2row .l b{display:block;font-size:30px;font-weight:800}
.a2row .l span{font-size:24px;color:var(--on-emph-2);font-weight:500}
.a2row .v{font-size:88px;font-weight:800;line-height:1;color:var(--accent)}
.mt4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.mt4 div{display:flex;flex-direction:column}
.mt4 span{font-size:18px;font-weight:700;opacity:.75;white-space:nowrap}
.mt4 b{font-size:46px;font-weight:800;line-height:1.1}
.aw.lucky{flex-direction:row;align-items:center;justify-content:space-between;gap:30px}
.lk-l .big{font-size:88px;margin-top:6px}
.lk-r{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;flex:1;max-width:760px}
.stat{min-width:0;padding:16px 20px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--emph-line)}
.stat span{display:block;font-size:20px;color:var(--on-emph-2);font-weight:600;white-space:nowrap}
.stat b{display:block;font-size:54px;font-weight:800;color:var(--accent);line-height:1.1;margin:4px 0}
html[lang="en"] .stat b{font-size:44px}
html[lang="en"] .lk-l .big{font-size:80px}
.stat em{font-style:normal;font-size:20px;color:var(--on-emph-2);font-weight:600}

/* ---------- 5 · duplication simulation ---------- */
.s5{display:flex;flex-direction:column}
.s5 .h2,.s5 .top .sub,.tab,.pill,.k-lab,.gr,.gh{white-space:nowrap}
.s5 .top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.s5 .top .sub{font-size:26px;color:var(--ink-2);font-weight:500;margin-top:4px}
.s5 .ctrl{display:flex;align-items:center;gap:10px;padding-bottom:8px}
html[lang="en"] .s5 .h2{font-size:56px}
.tabs{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.tab{padding:9px 20px;border-radius:999px;font-size:25px;font-weight:700;color:var(--ink-2);transition:background .25s,color .25s,transform .12s}
.tab:hover{background:var(--surface-2)}
.tab:active{transform:scale(.97)}
.tab.on{background:var(--accent);color:var(--on-accent)}
.pill{padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;color:var(--ink-2);transition:transform .12s,background .25s}
.pill:hover{background:var(--surface-2)} .pill:active{transform:scale(.97)}
.pill.on{background:var(--emph);color:var(--on-emph);border-color:transparent}
.s5 .main{display:grid;grid-template-columns:860px 1fr;column-gap:40px;flex:1;min-height:0}
#viz{width:860px;height:762px;display:block}
.kpis{display:flex;flex-direction:column;gap:16px;min-height:0}
.k-main{padding:20px 36px 12px;height:236px}
.k-main .k-lab{color:var(--on-emph-2)}
.k-num{font-weight:800;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.k-main .k-num{color:var(--accent);margin-top:6px}
.k-approx{font-size:26px;font-weight:600;color:var(--on-emph-2);min-height:36px;margin-top:2px}
.k-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:122px}
.k-mini{padding:14px 26px}
.k-mini .k-num{margin-top:6px;color:var(--ink)}
.gtbl{padding:12px 26px 8px}
.gh,.gr{display:grid;grid-template-columns:160px 1fr 1.25fr;align-items:center}
.gh{font-size:20px;font-weight:700;color:var(--ink-3);height:32px;letter-spacing:.04em}
.gr{height:40px;font-size:25px;font-weight:600;border-top:1px solid var(--line);opacity:.18;transition:opacity .5s}
.gr.on{opacity:1}
.gr .gc{display:flex;align-items:center;gap:12px}
.gr .gc i{width:14px;height:14px;border-radius:50%;flex:none}
.gr .ic{position:relative;height:31px;display:flex;align-items:center;padding-left:12px;font-weight:800}
.gr .ic .gbar{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:10px;background:color-mix(in srgb,var(--accent) 34%,transparent);transform-origin:left;transform:scaleX(0);transition:transform .8s cubic-bezier(.16,1,.3,1)}
.gr .ic b{position:relative}
.s5 .note{margin-top:12px;font-size:19px;color:var(--ink-3);font-weight:500;line-height:1.4}

/* ---------- 5b · lucky bonus explainer ---------- */
.s7{display:flex;flex-direction:column}
.s7 .h2,.s7 .top .sub{white-space:nowrap}
.s7 .top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.s7 .top .sub{font-size:26px;color:var(--ink-2);font-weight:500;margin-top:4px}
.s7 .ctrl{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.s7 .ctrl .pill{min-width:52px;text-align:center}
.lk-main{display:grid;grid-template-columns:1fr 460px;column-gap:40px;flex:1;min-height:0}
.lk-stage-wrap{display:flex;align-items:center;justify-content:center;min-height:0}
#lkSvg{width:100%;height:100%;max-height:640px}
.lk-side{display:flex;flex-direction:column;gap:16px;min-height:0}
.lk-cap{padding:24px 30px;min-height:168px;display:flex;flex-direction:column;justify-content:center}
.lk-cap .k-lab{white-space:normal;line-height:1.35;display:block}
.lk-step-title{font-size:28px;font-weight:800;color:var(--on-emph);line-height:1.3;margin-top:4px}
.lk-cap p{font-size:24px;line-height:1.5;color:var(--on-emph-2);font-weight:500;margin-top:10px}
.lk-cap p b{color:var(--accent);font-weight:800}
.lk-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lk-stats .k-num{font-size:44px;font-weight:800;margin-top:4px}
.lk-dots{padding:20px 26px;flex:1;min-height:0;overflow:hidden;transition:opacity .3s}
.lk-dots.hide{opacity:0;pointer-events:none}
.lk-dots .ttl{font-size:20px;font-weight:700;color:var(--ink-2);margin-bottom:10px}
.lk-grid{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.lk-grid i{width:15px;height:15px;border-radius:4px;background:var(--surface-2);flex:none;transition:background .25s,transform .25s}
.lk-grid i.on{background:var(--accent);transform:scale(1.12)}
.s7 .note{margin-top:12px;font-size:18px;color:var(--ink-3);font-weight:500;line-height:1.45}
/* SVG node/link styling (colours applied inline via JS using CSS vars through getComputedStyle) */
.lk-node-you circle{fill:var(--accent)}
.lk-node-you text{fill:var(--on-accent);font-weight:800}
.lk-link{stroke:var(--line);stroke-width:2;fill:none;transition:stroke .3s,stroke-width .3s}
.lk-link.on{stroke:var(--accent);stroke-width:3}
.lk-pos circle{fill:var(--surface);stroke:var(--line);stroke-width:2;transition:fill .3s,stroke .3s}
.lk-pos.filled circle{fill:var(--surface-2);stroke:var(--ink-3)}
.lk-pos.op circle{fill:var(--emph);stroke:var(--emph)}
.lk-pos.hit circle{fill:var(--accent);stroke:var(--accent)}
.lk-pos text{fill:var(--ink-3);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.lk-pos.op text,.lk-pos.hit text{fill:var(--on-accent)}
.lk-layer-lbl{fill:var(--ink-3);font-size:16px;font-weight:700}

/* ---------- 6 · calculator ---------- */
.s6{display:flex;flex-direction:column}
.s6 .top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.s6 .h2,.s6 .k-lab{white-space:nowrap}

.s6 .seg{background:var(--surface);border:1px solid var(--line);padding:5px}

.calc{display:grid;grid-template-columns:900px 1fr;column-gap:40px;flex:1;min-height:0}
.inputs{display:flex;flex-direction:column;gap:14px;min-height:0}
.panel{padding:14px 26px 16px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ph .ttl{display:flex;align-items:center;gap:14px}
.ph b{font-size:34px;font-weight:800}
.ph .ps{font-size:22px;font-weight:600;color:var(--ink-2)}
.pg{display:grid;grid-template-columns:200px repeat(3,1fr);gap:8px 12px;align-items:center}
.lv{text-align:center;font-weight:800;font-size:22px;color:var(--ink-2)}
.rl{font-size:24px;font-weight:700;line-height:1.15}
.rl small{display:block;font-size:17px;color:var(--ink-3);font-weight:500}
.num{width:100%;height:52px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:30px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
.num::placeholder{color:var(--ink-3);font-weight:500}
.num:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.fine{font-size:18px;color:var(--ink-3);line-height:1.4;font-weight:500}
.results{display:flex;flex-direction:column;gap:14px;min-height:0}
.hero{padding:18px 34px 16px}
.hero .k-lab{color:var(--on-emph-2)}
#rTotal{font-weight:800;color:var(--accent);line-height:1.05;letter-spacing:-.02em;white-space:nowrap;margin-top:2px;font-size:100px}
.hero .split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;border-top:1px solid var(--emph-line);padding-top:10px}
.hero .split span{display:block;font-size:20px;color:var(--on-emph-2);font-weight:600}
.hero .split b{font-size:38px;font-weight:800;color:var(--on-emph)}
.cardline{margin-top:8px;font-size:20px;color:var(--on-emph-2);font-weight:600}
.ltbl{padding:8px 26px 6px}
.lh,.lr{display:grid;grid-template-columns:1fr 170px 190px;align-items:center;column-gap:10px}
.lh{height:34px;font-size:19px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.lh span:not(:first-child),.lr .v{text-align:right}
.lr{min-height:56px;border-top:1px solid var(--line);position:relative}
.lr .nm2 b{display:block;font-size:26px;font-weight:800;line-height:1.15}
.lr .nm2 small{display:block;font-size:17px;color:var(--ink-3);font-weight:500;line-height:1.25}
.lr .v{font-size:28px;font-weight:800;white-space:nowrap}
.lr .v.z{color:var(--ink-3);font-weight:500}
.lr[class*=" g"]::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:5px;border-radius:3px}
.lr.ga .nm2 b,.lr.ga .v:not(.z){color:var(--green)}
.lr.ga::before{background:var(--green)}
.lr.gb .nm2 b,.lr.gb .v:not(.z){color:var(--accent-text)}
.lr.gb::before{background:var(--accent)}
.lr.gc::before{background:color-mix(in srgb,var(--accent) 45%,transparent)}

/* ---------- chrome (progress + toolbar), outside the scaled stage ---------- */
.chrome{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
.dock{display:flex;align-items:center;pointer-events:none}
.prog{display:flex;gap:6px;padding:0 18px 12px;pointer-events:auto;flex:1}
.prog button{flex:1;height:22px;position:relative;opacity:.9}
.prog button::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:4px;border-radius:2px;background:var(--line);transition:background .3s,height .3s}
.prog button.on::after{background:var(--accent);height:6px;bottom:7px}
.navbtn{display:none}
.pageno{display:none;font-weight:800;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{position:absolute;right:18px;bottom:38px;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 20px;border-radius:999px;
  background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none}
.chrome.show .bar{opacity:1;transform:none;pointer-events:auto}
.bar .hint{font-size:15px;color:var(--ink-3);white-space:nowrap;margin-right:6px}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--surface-2)}
.seg button{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-2);transition:background .2s,color .2s;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.bar>button{padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.bar button:focus-visible,.tab:focus-visible,.pill:focus-visible,.prog button:focus-visible,.navbtn:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* =====================================================================
   MOBILE / NARROW / PORTRAIT  (body.m — set by JS; rules go last on purpose)
   ===================================================================== */
html body.m #stage{position:absolute;left:0;top:0;width:100%;height:100%;transform:none!important;font-size:16px;line-height:1.4}

/* chrome */
html body.m .bar{position:fixed;left:0;right:0;top:0;bottom:auto;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-radius:0;border-width:0 0 1px;opacity:1;transform:none;pointer-events:auto;justify-content:space-between;box-shadow:none;gap:8px;background:color-mix(in srgb,var(--bg) 92%,transparent)}
html body.m .bar .hint,html body.m #fsBtn{display:none}
html body.m .pageno{display:inline}
html body.m .seg button{padding:7px 12px;font-size:14px}
html body.m .dock{position:fixed;left:0;right:0;bottom:0;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);pointer-events:auto}
html body.m .prog{padding:0}
html body.m .navbtn{display:grid;place-items:center;width:58px;height:46px;border-radius:999px;background:var(--surface-2);font-size:30px;font-weight:700;line-height:1;pointer-events:auto}
html body.m .navbtn.next{background:var(--accent);color:var(--on-accent)}

/* 1 cover */
html body.m .s1 .cover{grid-template-columns:1fr;height:auto;row-gap:22px;align-content:start;padding-top:8px}
html body.m .s1 h1{font-size:clamp(64px,23vw,128px);margin-bottom:16px}

html[lang="en"] body.m .s1 .cover-sub{font-size:22px}
html body.m .s1 .cover-small{font-size:17px}
html body.m .chart{width:100%;height:auto;max-height:44vh}
/* 2 advantages */
html body.m .s2 .h2{margin-bottom:16px}
html body.m .adv-grid{grid-template-columns:1fr;grid-template-rows:none;gap:12px}
html body.m .adv{grid-column:auto;padding:16px 18px}
html body.m .adv-n{font-size:14px}
html body.m .adv h3{font-size:22px;margin-top:4px}
html[lang="en"] body.m .adv h3{font-size:20px}

html[lang="en"] body.m .adv p{font-size:15px}
/* 3 levels */
html body.m .s3 .top,html body.m .s4 .top{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:14px}
html body.m .s3 .h2,html body.m .s3 .top .lead{white-space:normal}

/* 4 bonuses */
html body.m .s4 .base{font-size:15px;padding:12px 14px;gap:10px;flex-wrap:wrap;margin-bottom:12px}
html[lang="en"] body.m .s4 .base{font-size:15px}

html body.m .aw .hd-row{flex-wrap:wrap;gap:6px}
html body.m .aw .ttl{flex-wrap:wrap;gap:4px 12px}

html body.m .rail{grid-template-columns:repeat(3,1fr);row-gap:12px;column-gap:6px}
html body.m .rail::before{display:none}
html body.m .node .amt{font-size:20px}

html body.m .trio b{font-size:24px}
html body.m .trio span,html body.m .trio em{font-size:13px}
html body.m .big{font-size:44px}
html body.m .a2row .v{font-size:42px}
html body.m .a2row .l b{font-size:18px}
html body.m .a2row .l span{font-size:14px}
html body.m .mt4{grid-template-columns:repeat(2,1fr);gap:10px 8px}
html body.m .mt4 b{font-size:30px}
html body.m .mt4 span{font-size:13px}
html body.m .aw.lucky{flex-direction:column;align-items:stretch;gap:12px}
html body.m .lk-l .big{font-size:52px}
html body.m .lk-r{grid-template-columns:repeat(3,1fr);gap:8px;max-width:none}
html body.m .stat{padding:10px 10px}
html body.m .stat span,html body.m .stat em{font-size:12.5px;white-space:normal}
html body.m .stat b{font-size:24px}
html body.m .s5,html body.m .s6,html body.m .s7{display:block}
html body.m .calc,html body.m .s5 .main,html body.m .inputs,html body.m .results,html body.m .kpis,html body.m .lk-main,html body.m .lk-side{min-height:0;flex:none}
html body.m .inputs,html body.m .results{display:flex;flex-direction:column;gap:12px}
/* 5 simulation */
html body.m .s5 .top{flex-direction:column;align-items:stretch;gap:10px}
html body.m .s5 .h2,html body.m .s5 .top .sub{white-space:normal}
html[lang="en"] body.m .s5 .h2{font-size:27px}

html body.m .s5 .main{grid-template-columns:1fr;row-gap:14px}
html body.m #viz{width:100%;height:auto;aspect-ratio:860/762}

html body.m .k-mini{padding:10px 14px}
html body.m .gtbl{padding:8px 14px 4px}
html body.m .gh,html body.m .gr{grid-template-columns:96px 1fr 1.2fr}
html body.m .gh{font-size:12px;height:26px}
html body.m .gr{height:36px;font-size:15px}

html body.m .gr .gc i{width:10px;height:10px}
html body.m .s5 .note{font-size:12px;margin-top:4px}
/* 5b lucky explainer */

html body.m .s6 .top{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:12px}

html body.m .calc{grid-template-columns:1fr;row-gap:14px}
html body.m .panel{padding:12px 14px 14px}
html body.m .ph b{font-size:20px}
html body.m .ph .ps{font-size:13px}
html body.m .pg{grid-template-columns:78px repeat(3,1fr);gap:8px}
html body.m .lv{font-size:14px}
html body.m .rl{font-size:14px}
html body.m .rl small{font-size:11.5px}
html body.m .num{height:44px;font-size:18px}
html body.m .fine{font-size:12.5px}
html body.m .hero{padding:14px 18px 12px}
html body.m .hero .split b{font-size:22px}
html body.m .hero .split span{font-size:13px}
html body.m .cardline{font-size:13px}

@media (min-width:640px){
  html body.m .adv-grid,html body.m .tbl.mob,html body.m .aw-grid{grid-template-columns:1fr 1fr}

}

<body>
<div id="viewport">
  <div id="stage">

    <!-- 1 · COVER -->
    <section class="slide s1" data-slide="0">
      <div class="cover">
        <div>
          <h1 class="rv" style="--i:0"><span class="em" data-i18n="c.t1"></span><span data-i18n="c.t2"></span></h1>
          <p class="cover-sub rv" style="--i:2" data-i18n="c.sub"></p>
          <p class="cover-small rv" style="--i:3" data-i18n="c.small"></p>
        </div>
        <div class="rv" style="--i:2">
          <svg class="chart" id="chart" viewBox="0 0 760 720" role="img" aria-label="Compounding vs linear">
            <path class="ax" d="M50 60 V640 H730"/>
            <text class="t-muted" x="62" y="52" data-i18n="c.result"></text>
            <text class="t-muted" x="730" y="684" text-anchor="end" data-i18n="c.time"></text>
            <path class="gap" id="gapArea"/>
            <path class="line lin" id="linLine"/>
            <path class="line exp" id="expLine"/>
            <circle class="endpt" id="endPt" r="15"/>

            <text class="lbl t-acc" id="expLbl" text-anchor="end" data-i18n="c.dir"></text>
            <text class="lbl t-acc" id="gapLbl" text-anchor="end" data-i18n="c.compound"></text>
          </svg>
        </div>
      </div>
    </section>

    <!-- 2 · NINE ADVANTAGES -->
    <section class="slide s2" data-slide="1">
      <h2 class="h2 rv" style="--i:0"><span data-i18n="s2.t1"></span> <span class="em" data-i18n="s2.t2"></span></h2>
      <div class="adv-grid" id="advGrid"></div>
    </section>

    <!-- 3 · LEVELS -->
    <section class="slide s3" data-slide="2">
      <div class="top rv" style="--i:0">
        <h2 class="h2"><span data-i18n="s3.t"></span></h2>

      <h3 class="paths-t rv" style="--i:3" data-i18n="s3.pathsTitle"></h3>
      <div class="paths" id="paths"></div>
    </section>

    <!-- 4 · SEVEN BONUSES -->
    <section class="slide s4" data-slide="3">
      <div class="top rv" style="--i:0"><h2 class="h2" data-i18n="s4.t"></h2></div>
      <div class="base card emph rv" style="--i:1"><span class="tag" data-i18n="s4.tag"></span><span data-i18n="s4.base"></span></div>
      <div class="aw-grid" id="awGrid"></div>
    </section>

    <!-- 5 · LUCKY BONUS EXPLAINER -->
    <section class="slide s7" data-slide="4">
      <div class="top rv" style="--i:0">
        <div><h2 class="h2" data-i18n="s7.t"></h2><p class="sub" data-i18n="s7.sub"></p></div>
        <div class="ctrl" data-nogo>
          <button class="pill" id="lkPrev">‹</button>
          <button class="pill" id="lkPlay"></button>
          <button class="pill" id="lkNext">›</button>
        </div>
      </div>
      <div class="lk-main">
        <div class="lk-stage-wrap rv" style="--i:1"><svg id="lkSvg" viewBox="0 0 1040 760" role="img" aria-label="Lucky bonus binary tree"></svg></div>
        <div class="lk-side">
          <div class="card emph lk-cap rv" style="--i:2">
            <div class="k-lab" id="lkStepNo"></div>
            <div class="lk-step-title" id="lkStepLab"></div>
            <p id="lkStepText"></p>

const X0=50, XS=68, Y0=640, YS=560/26;

const fLin=x=>1+0.9*x, fExp=x=>Math.exp(0.32*x);
function pathFor(f,a,b,step=.2){let d='';for(let x=a;x<=b+1e-9;x+=step){d+=(d?'L':'M')+px(x).toFixed(1)+' '+py(f(x)).toFixed(1)}return d}
function buildChart(){
  let lo=3,hi=8; for(let i=0;i<40;i++){const m=(lo+hi)/2; (fExp(m)<fLin(m))?lo=m:hi=m;} const xc=(lo+hi)/2;
  $('#linLine').setAttribute('d',pathFor(fLin,0,10));
  $('#expLine').setAttribute('d',pathFor(fExp,0,10));
  let a=pathFor(fExp,xc,10); for(let x=10;x>=xc-1e-9;x-=.2) a+='L'+px(x).toFixed(1)+' '+py(fLin(x)).toFixed(1);
  $('#gapArea').setAttribute('d',a+'Z');
  $$('#chart .line').forEach(p=>p.style.setProperty('--len',Math.ceil(p.getTotalLength?p.getTotalLength():2000)+8));

/* =====================================================================
   Slide 5 · duplication simulation
   ===================================================================== */
const viz={mi:0,p:0,raf:0,t0:0,dur:4400,auto:false,timer:0,ctx:null,W:860,H:762};
const cv=$('#viz');
const easeOut=t=>1-Math.pow(1-t,3);
const css=v=>getComputedStyle(html).getPropertyValue(v).trim();
function rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
const mixc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const ringCol=(g,accent,muted)=>mixc(accent,muted,((g-1)/7)*.72);
const RAD=g=>46+(g-1)*46, DR=[7,6,5.2,4.5,3.8,3.2,2.7,2.3];

function sizeCanvas(){
  const cssScale = mobile ? ((cv.offsetWidth||viz.W)/viz.W) : scale;
  const r=cssScale*Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(viz.W*r); cv.height=Math.round(viz.H*r);
  viz.ctx=cv.getContext('2d'); viz.ctx.setTransform(r,0,0,r,0,0);
  drawViz(viz.p);
}
function drawViz(p){
  const c=viz.ctx; if(!c) return;
  const W=viz.W,H=viz.H,cx=W/2,cy=H/2+4,N=MODELS[viz.mi];
  const accent=rgb(css('--accent')),muted=rgb(css('--ink-2')),line=rgb(css('--line')),onAcc=css('--on-accent');
  c.clearRect(0,0,W,H);
  c.lineWidth=1.5;
  for(let g=1;g<=GENS;g++){c.beginPath();c.arc(cx,cy,RAD(g),0,Math.PI*2);c.strokeStyle=rgba(line,.75);c.stroke();}
  let prev=null;
  for(let g=1;g<=GENS;g++){
    const a=clamp(p-(g-1),0,1); if(a<=0) break;
    const ea=easeOut(a), r=RAD(g)*(.78+.22*ea), dr=DR[g-1];
    const total=Math.pow(N,g), cap=Math.floor(2*Math.PI*RAD(g)/(dr*2+3.2)), n=Math.min(total,cap), capped=total>cap;
    const col=ringCol(g,accent,muted);
    const pts=[]; for(let i=0;i<n;i++){const th=-Math.PI/2+2*Math.PI*(i+.5)/n; pts.push([cx+r*Math.cos(th),cy+r*Math.sin(th)]);}
    if(!capped && n<=520 && (g===1 || (prev&&!prev.capped))){
      c.beginPath();
      for(let i=0;i<n;i++){const pp=g===1?[cx,cy]:prev.pts[Math.floor(i/N)]; c.moveTo(pp[0],pp[1]); c.lineTo(pts[i][0],pts[i][1]);}
      c.strokeStyle=rgba(col,.30*ea); c.lineWidth=1.3; c.stroke();
    }
    if(capped){ c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.strokeStyle=rgba(col,.22*ea); c.lineWidth=dr*2+2; c.stroke(); }

    for(let i=0;i<n;i++){c.beginPath();c.arc(pts[i][0],pts[i][1],dr*(.4+.6*ea),0,Math.PI*2);c.fill();}
    c.shadowBlur=0;
    prev={pts,capped};
  }
  c.beginPath(); c.arc(cx,cy,30,0,Math.PI*2); c.fillStyle=rgba(accent,1); c.shadowColor=rgba(accent,.6); c.shadowBlur=22; c.fill(); c.shadowBlur=0;

function buildCalc(){

function syncInputs(){

function compute(){
  const sum=a=>a[0]+a[1]+a[2], bvOf=a=>a[0]*BVL[0]+a[1]*BVL[1]+a[2]*BVL[2];
  const M={};
  ['A','B'].forEach(m=>{const x=S[m];
    M[m]={n8:sum(x.g1)+sum(x.g28), n:sum(x.g1)+sum(x.g28)+sum(x.out), bv8:bvOf(x.g1)+bvOf(x.g28), bv:bvOf(x.g1)+bvOf(x.g28)+bvOf(x.out)};});
  const g1n=sum(S.A.g1)+sum(S.B.g1), g28n=sum(S.A.g28)+sum(S.B.g28), N8=g1n+g28n;
  const direct=[0,1,2].reduce((s,k)=>s+(S.A.g1[k]+S.B.g1[k])*DIR[k],0);

  const matchM=(REPBV*0.075)*Math.min(M.A.n,M.B.n);            // $6 per matched repurchase
  const matchO=0.15*Math.min(M.A.bv,M.B.bv);                     // 15% of smaller-side join BV
  let lkM=0.10*(REPBV*0.075)*Math.min(M.A.n8,M.B.n8);            // 10% of 8-layer repurchase matching (estimated from gens 1~8)
  let lkO=0.10*0.15*Math.min(M.A.bv8,M.B.bv8);                   // 10% of 8-layer join matching (estimated from gens 1~8)
  const cap=S.role==='con'?600:2000, raw=lkM+lkO, f=raw>cap?cap/raw:1; lkM*=f; lkO*=f;
  const rows={direct:{m:0,o:direct},repurchase:{m:g1n*REP1+g28n*REP28,o:0},mgmt:{m:mgmtOf(N8),o:0},ach:{m:0,o:achOf(N8)},contrib:{m:contribOf(N8),o:0},match:{m:matchM,o:matchO},lucky:{m:lkM+lkO,o:0}};
  let tm=0,to=0; for(const k in rows){rows[k].m=Math.round(rows[k].m);rows[k].o=Math.round(rows[k].o);tm+=rows[k].m;to+=rows[k].o;}
  return {M,N8,cap,card,rows,tm,to,total:tm+to};
}

/* =====================================================================
   Slide 5 (s7) · lucky bonus explainer — 8-step scripted animation
   Steps 0-3: narrative (spillover -> operator -> 10% -> cap raise), a small
              3-layer binary tree with one highlighted illustrative position.
   Steps 4-7: the full 8-layer tree unfolds, layer count racing up to 510.
   ===================================================================== */
const LK_GENS=8;
const lk={step:0,built:false,pos:[]};
const lkAuto={on:false,timer:0};
const LK_R0=34, LK_DR=[50,46,42,38,34,30,27,24];
function lkRadius(g){ let r=LK_R0; for(let i=0;i<g;i++) r+=LK_DR[i]; return r; }
function lkBuildSvg(){
  const svg=$('#lkSvg'); const W=1040,H=760,cx=W/2,cy=H/2+6;
  svg.innerHTML='<g id="lkLinks"></g><g id="lkNodes"></g>';
  const nodesEl=$('#lkNodes',svg), linksEl=$('#lkLinks',svg);
  nodesEl.insertAdjacentHTML('beforeend',
    `<g class="lk-node-you" transform="translate(${cx},${cy})"><circle r="30"/><text y="1">${T().s7.you}</text></g>`);
  lk.pos=[];
  for(let g=1; g<=LK_GENS; g++){
    const n=Math.pow(2,g), r=lkRadius(g), layer=[];
    for(let i=0;i<n;i++){
      const th=-Math.PI/2 + (2*Math.PI*(i+0.5))/n;
      const x=cx+r*Math.cos(th), y=cy+r*Math.sin(th);
      const parent = g===1 ? {x:cx,y:cy} : lk.pos[g-2][i>>1];
      const lid='lkl-'+g+'-'+i, pid='lkp-'+g+'-'+i;
      linksEl.insertAdjacentHTML('beforeend',
        `<path id="${lid}" class="lk-link" d="M${parent.x.toFixed(1)},${parent.y.toFixed(1)} L${x.toFixed(1)},${y.toFixed(1)}"/>`);
      const rad = g<=4?7:g<=6?6:5;
      nodesEl.insertAdjacentHTML('beforeend',
        `<g id="${pid}" class="lk-pos" data-g="${g}"><circle r="${rad}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}"/></g>`);
      layer.push({x:x,y:y});
    }

  }

function lkPathOn(g,i){

vp.addEventListener('pointerup',e=>{
  if(!start) return; const dx=e.clientX-start.x, dy=e.clientY-start.y; start=null;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3){ dx<0?next():prev(); return; }   // swipe left → next, swipe right → prev
  if(!mobile && Math.abs(dx)<14 && Math.abs(dy)<14){ e.clientX<window.innerWidth/2?prev():next(); } // desktop tap: left half → prev, right half → next
});
vp.addEventListener('pointercancel',()=>{start=null});
vp.addEventListener('pointermove',()=>showChrome(2200));
vp.addEventListener('wheel',e=>{
  if(mobile||idx===6) return;
  const now=performance.now(); if(now-lastWheel<700||Math.abs(e.deltaY)<30) return;
  lastWheel=now; e.deltaY>0?next():prev();
},{passive:true});

document.addEventListener('keydown',e=>{
  const tg=e.target;
  if(tg&&tg.matches&&tg.matches('input,textarea,select')){ if(e.key==='Escape') tg.blur(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(tg&&tg.closest&&tg.closest('button')&&(k===' '||k==='Enter')) return;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev();}
  else if(k==='Home'){go(0);} else if(k==='End'){go(slides.length-1);}
  else if(k==='f'||k==='F'){toggleFs();}
  else if(k==='t'||k==='T'){setTheme(theme==='light'?'dark':'light');}
  else if(k==='l'||k==='L'){setLang(LANGS[(LANGS.indexOf(lang)+1)%LANGS.length]);}
  else if(idx===5){
    if(/^[2-6]$/.test(k)) selectModel(+k-2);
    else if(k==='r'||k==='R'){autoStop();play();}
    else if(k==='a'||k==='A'){viz.auto?autoStop():autoStart();}
  }
  else if(idx===4){
    if(k==='ArrowRight'){} // already advances slide; use n/p for step-only nav below
    else if(k==='n'||k==='N'){lkStep(1);}
    else if(k==='p'||k==='P'){lkStep(-1);}
    else if(k==='a'||k==='A'){lkAuto.on?lkAutoStop():lkAutoStart();}
  }
  showChrome(1600);
});

function toggleFs(){
  const d=document;
  if(!d.fullscreenElement){(html.requestFullscreen||html.webkitRequestFullscreen||(()=>{})).call(html);}
  else{(d.exitFullscreen||d.webkitExitFullscreen||(()=>{})).call(d);}
}
$('#fsBtn').addEventListener('click',toggleFs);
$('#prevBtn').addEventListener('click',prev);
$('#nextBtn').addEventListener('click',next);
$$('#langSeg button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
$$('#themeSeg button').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeSet)));
prog.addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b) go(+b.dataset.go);});
let rz=0;
window.addEventListener('resize',()=>{
  cancelAnimationFrame(rz);
  rz=requestAnimationFrame(()=>{ const ch=applyMode(); fit(); if(ch) renderAll(); });
});
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10); if(n&&n-1!==idx) go(n-1);});

/* =====================================================================
   boot
   ===================================================================== */
html.lang=lang; html.dataset.theme=theme;
applyMode();
buildChart(); buildTabs(); buildRows(); buildCalc(); buildLucky();
['A','B'].forEach(m=>RK.forEach(r=>{S[m][r]=EX[m][r].slice();})); syncInputs();   // start with a filled example
renderAll(); fit();
const startN=parseInt(location.hash.slice(1),10);
go(startN>=1&&startN<=slides.length?startN-1:0);
showChrome(4500);
})();
</script>
