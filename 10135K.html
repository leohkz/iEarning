 $('#stage').innerHTML=[
 `<div class="pg"><span class="eb rv">${d.c.eb}</span><h1 class="rv" style="--i:1">${d.c.h1}</h1><p class="lead rv" style="--i:2">${d.c.lead}</p><div class="path rv" style="--i:3">${d.c.path.map((x,i)=>(i?'<span class="pa"></span>':'')+`<span class="pn${i?'':' k'}">${x}</span>`).join('')}</div></div>`,
 `<div class="pg"><h2 class="rv">${d.t.h}</h2><p class="lead rv" style="--i:1">${d.t.lead}</p><div class="card rv" style="--i:2;margin-top:20px"><div style="font-weight:800;font-size:20px">${d.t.win}</div><div class="months">${d.t.m.map((m,i)=>`<span style="--i:${i}">${m}</span>`).join('')}</div><div class="chips">${d.t.chips.map(c=>`<div><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')}</div></div></div>`,
 `<div class="pg"><h2 class="rv">${d.s.h}</h2><p class="lead rv" style="--i:1">${d.s.lead}</p><div class="grid"><div class="card emph rv" style="--i:2"><svg id="tree" viewBox="0 0 600 330">${tree}</svg><div class="cnt"><span id="seedN">0</span> / 10<small>${d.s.unit}</small></div></div><div class="card rv" style="--i:3"><h3 style="font-size:22px;font-weight:800">${d.s.cond}</h3><ul class="src">${d.s.src.map(s=>`<li><b>${s[0]}</b>　${s[1]}</li>`).join('')}</ul></div></div><div class="grid">${[0,1].map(i=>`<div class="card prize rv" style="--i:${i+2}"><span class="t">${d.s.p[i]}</span><span class="a">$${PRIZE[i].toLocaleString('en-US')}</span><div class="bar"><i style="--w:${i?50:100}%"></i></div><span class="sm">${d.s.once}</span></div>`).join('')}</div></div>`,
 `<div class="pg"><h2 class="rv">${d.u.h}</h2><p class="lead rv" style="--i:1">${d.u.lead}</p><div class="stairs">${d.u.st.map((s,i)=>`<div class="st" style="--h:${[56,77,98][i]}%;--i:${i}"><small>${s[0]}</small><span class="n">${s[1]}</span><small>${s[2]}</small><span class="p">$${STEP[i].toLocaleString('en-US')}</span></div>`).join('')}</div><div class="rules rv" style="--i:3">${d.u.rules.map((r,i)=>`<span><b>${i+1}</b>${r}</span>`).join('')}</div></div>`,
 `<div class="pg"><h2 class="rv">${d.a.h}</h2><p class="lead rv" style="--i:1">${d.a.lead}</p><div class="card emph rv" style="--i:2;margin-top:20px"><div class="seg" id="route">${d.a.r.map((r,i)=>`<button data-r="${i}" class="${S.route===i?'on':''}">${r}</button>`).join('')}</div><div class="cnt" style="margin-top:14px">$<span id="tot">0</span></div><div class="stack" id="stack"></div><div class="leg" id="leg"></div></div></div>`,
 `<div class="pg"><h2 class="rv">${d.k.h}</h2><p class="lead rv" style="--i:1">${d.k.lead}</p><div class="calc"><div class="card rv" style="--i:2">${num('l2',d.k.in[0])+num('l3',d.k.in[1])+num('l4',d.k.in[2])+num('mo',d.k.in[3])+num('rt',d.k.in[4])}<div class="sm" style="margin-top:8px">${d.k.lvT}</div><div class="lvs">${d.k.lv.map((l,i)=>`<button data-lv="${i}" class="${S.lv[i]?'on':''}">${l}</button>`).join('')}</div></div><div class="card emph rv" style="--i:3"><div class="sm" style="color:var(--on-emph-2)">${d.k.tot}</div><div class="big" id="kT">0</div><div class="pb"><i id="kB"></i></div><div class="st2" id="kS"></div><div id="kR" style="margin-top:8px"></div><div class="sm" style="color:var(--on-emph-2);margin-top:8px">${d.k.note}</div></div></div></div>`
 ].map((h,i)=>`<section class="slide${i===idx?' on':i<idx?' bf':''}" aria-hidden="${i!==idx}">${h}</section>`).join('');
 const u=d.ui;$$('#themeSeg button').forEach((b,i)=>b.textContent=u[i]);$('#fsBtn').textContent=u[2];
 $$('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));$$('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===theme));
 document.title=z(d.c.eb);
 if(lang==='zh-Hans')$$('.slide,.panel+*').forEach(()=>{});
 if(lang==='zh-Hans')walk($('#stage'));
 renderTotal(false);renderCalc();
 if(idx===2)runSeeds();
}
function walk(n){const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let t;while(t=w.nextNode())t.nodeValue=z(t.nodeValue);}
function renderTotal(anim){
 const d=D(),vals=[PRIZE[S.route],...STEP],tot=vals.reduce((a,b)=>a+b,0);
 $('#stack').innerHTML=vals.map((v,i)=>`<i style="background:${SEGC[i]}" data-w="${v/tot*100}"></i>`).join('');
 $('#leg').innerHTML=vals.map((v,i)=>`<span><u style="background:${SEGC[i]}"></u>${z(d.a.n[i])} <b>$${v.toLocaleString('en-US')}</b></span>`).join('');
 requestAnimationFrame(()=>requestAnimationFrame(()=>$$('#stack i').forEach(e=>e.style.width=e.dataset.w+'%')));
 count($('#tot'),tot,anim&&!reduce?1100:0);
}
function count(el,to,ms){const from=+el.dataset.v||0,t0=performance.now();el.dataset.v=to;if(!ms){el.textContent=to.toLocaleString('en-US');return;}
 (function f(t){const e=Math.min(1,(t-t0)/ms);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-e,3))).toLocaleString('en-US');if(e<1)requestAnimationFrame(f)})(t0);}
function renderCalc(){
 const d=D(),n=S.l2+S.l3+S.l4,v=[(S.l2*80+S.l3*500+S.l4*1000)*.075,n*S.mo*6,S.rt*.1,S.lv.filter(Boolean).length*1000],tot=v.reduce((a,b)=>a+b,0);
 $('#kT').textContent=fmt(tot);$('#kB').style.width=Math.min(100,tot/10)+'%';
 $('#kS').textContent=z(tot>=1000?d.k.ok:d.k.left.replace('{n}',fmt(1000-tot)));
 $('#kR').innerHTML=v.map((x,i)=>`<div class="br"><span>${z(d.k.rows[i])}</span><b>+${fmt(x)}</b></div>`).join('');
}
function runSeeds(){clearTimeout(seedT);$$('#tree g,#tree line').forEach(e=>e.classList.remove('on'));$('#seedN').textContent=0;
 let i=0;(function step(){if(i>=10)return;$('#n'+i).classList.add('on');$('#l'+i).classList.add('on');$('#seedN').textContent=++i;seedT=setTimeout(step,reduce?0:300);})();}
function go(n){
 n=Math.max(0,Math.min(5,n));const was=idx;idx=n;
 $$('.slide').forEach((s,i)=>{s.classList.toggle('on',i===n);s.classList.toggle('bf',i<n);s.setAttribute('aria-hidden',i!==n);if(i===n)s.scrollTop=0;});
 $$('#prog button').forEach((b,i)=>b.classList.toggle('on',i===n));$('#pv').disabled=n===0;$('#nx').disabled=n===5;
 try{history.replaceState(null,'','#'+(n+1))}catch(e){}
 if(n===2&&was!==2)setTimeout(runSeeds,500);if(n===4&&was!==4)renderTotal(true);
}
const setLang=l=>{lang=l;html.lang=l;store.set('deck-lang',l);build();};
const setTheme=t=>{theme=t;html.dataset.theme=t;store.set('deck-theme',t);$$('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));};
$('#prog').innerHTML=[0,1,2,3,4,5].map(i=>`<button data-go="${i}" aria-label="${i+1}"></button>`).join('');
$('#prog').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
$('#pv').onclick=()=>go(idx-1);$('#nx').onclick=()=>go(idx+1);
$('#langSeg').onclick=e=>{const b=e.target.closest('[data-l]');if(b)setLang(b.dataset.l)};
$('#themeSeg').onclick=e=>{const b=e.target.closest('[data-t]');if(b)setTheme(b.dataset.t)};
$('#setBtn').onclick=()=>{const o=$('#ui').classList.toggle('open');$('#setBtn').setAttribute('aria-expanded',o)};
$('#fsBtn').onclick=()=>{document.fullscreenElement?document.exitFullscreen():html.requestFullscreen&&html.requestFullscreen()};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#ui')){$('#ui').classList.remove('open');$('#setBtn').setAttribute('aria-expanded','false')}});
$('#stage').addEventListener('click',e=>{
 const r=e.target.closest('#route button');if(r){S.route=+r.dataset.r;$$('#route button').forEach(b=>b.classList.toggle('on',b===r));renderTotal(true);return}
 const l=e.target.closest('[data-lv]');if(l){const i=+l.dataset.lv;S.lv[i]=S.lv[i]?0:1;l.classList.toggle('on',!!S.lv[i]);renderCalc();}
});
$('#stage').addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.k)return;const v=el.value.replace(/\D/g,'').slice(0,9);if(v!==el.value)el.value=v;S[el.dataset.k]=v?parseInt(v,10):0;renderCalc();});
$('#stage').addEventListener('focusin',e=>{if(e.target.classList.contains('num'))setTimeout(()=>{try{e.target.select()}catch(_){}},0)});
let st=null;const vp=$('#vp');
vp.addEventListener('pointerdown',e=>{st=e.target.closest('input,[data-nogo]')?null:{x:e.clientX,y:e.clientY}});
vp.addEventListener('pointerup',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;st=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)go(idx+(dx<0?1:-1))});
document.addEventListener('keydown',e=>{
 if(e.target.matches&&e.target.matches('input')){if(e.key==='Escape')e.target.blur();return}
 if(e.metaKey||e.ctrlKey||e.altKey||(e.target.closest&&e.target.closest('button,a')&&(e.key===' '||e.key==='Enter')))return;
 const k=e.key;
 if(k==='Escape'){$('#ui').classList.remove('open')}
 else if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();go(idx+1)}
 else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(idx-1)}
 else if(k==='Home')go(0);else if(k==='End')go(5);
 else if(k==='t'||k==='T')setTheme(theme==='light'?'dark':'light');
 else if(k==='l'||k==='L')setLang(LANGS[(LANGS.indexOf(lang)+1)%3]);
});
html.lang=lang;html.dataset.theme=theme;
const h0=parseInt(location.hash.slice(1),10);if(h0>=1&&h0<=6)idx=h0-1;
build();go(idx);
})();
</script>
